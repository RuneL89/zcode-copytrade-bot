<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0b0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ZCode Bot · Copy Trading</title>
    <script>
      // Pre-paint theme: resolve the stored choice (system|dark|light) before
      // first paint so the page never flashes the wrong palette. Keep this in
      // sync with src/theme.tsx (same key, same resolution).
      (function () {
        try {
          var choice = localStorage.getItem('zcode-theme') || 'system';
          var dark =
            choice === 'dark' ||
            (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
