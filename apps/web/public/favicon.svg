<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    ZCode Bot app icon: charcoal rounded-square tile, cyan robot mark.
    Design: flat minimal icon, crisp at 16px — thick rounded shapes, one
    accent hue (cyan #22d3ee) on a near-black tile (#0e1116), subtle border.
  -->
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dedfb" />
      <stop offset="1" stop-color="#0ea5c4" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0e1116" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5" />
  <path d="M32 15v5" stroke="#22d3ee" stroke-width="3.4" stroke-linecap="round" />
  <circle cx="32" cy="13.5" r="3.2" fill="#7dedfb" />
  <rect x="13" y="22" width="38" height="27" rx="9" fill="url(#head)" />
  <circle cx="24.5" cy="34.5" r="3.6" fill="#0a0b0e" />
  <circle cx="39.5" cy="34.5" r="3.6" fill="#0a0b0e" />
  <path d="M26.5 42.5h11" stroke="#0a0b0e" stroke-width="2.8" stroke-linecap="round" />
